# Tâches planifiées de l'outil (remplacent les « Vercel Cron », qui bloquaient les mises en ligne).
# GitHub appelle simplement les adresses protégées du site ; le travail se fait sur le site.
# Prérequis (une fois) : secret de dépôt CRON_SECRET = même valeur que dans Vercel (Settings → Secrets and variables → Actions).
# Heures en UTC : 01:00 UTC = 2 h à Paris en hiver (3 h en été).
name: Tâches planifiées

on:
  schedule:
    - cron: "0 1 * * *"    # fichier Excel de suivi
    - cron: "30 1 * * *"   # CV SharePoint (association, fiches, analyse)
    - cron: "17 * * * *"   # candidatures email (toutes les heures)
    # La relance des disponibilités n'est jamais planifiée : seul un administrateur la lance, depuis l'application.
  workflow_dispatch:
    inputs:
      tache:
        description: "Tâche à lancer à la main"
        required: true
        default: emails
        type: choice
        options: [excel, cv, emails]

permissions: {}

jobs:
  lancer:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Appeler la tâche sur le site
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLANIF: ${{ github.event.schedule }}
          MANUELLE: ${{ inputs.tache }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Secret CRON_SECRET absent : rien n'est lancé."; exit 0; fi
          case "$PLANIF" in
            "0 1 * * *") T=excel ;;
            "30 1 * * *") T=cv ;;
            "17 * * * *") T=emails ;;
            *) T="$MANUELLE" ;;
          esac
          echo "Tâche : $T"
          code=$(curl -s -o reponse.json -w "%{http_code}" --max-time 330 -H "Authorization: Bearer $CRON_SECRET" "https://ats-unitechsolutions.vercel.app/api/cron/$T")
          head -c 1500 reponse.json; echo
          test "$code" = "200"
